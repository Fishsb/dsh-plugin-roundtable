name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # npm 发布必须由拥有 @huanlin scope 的账号执行；本仓保留源码与 Release，
    # 只有显式设置仓库变量 NPM_PUBLISH=true 时才尝试发布（缺 token 必定失败）。
    if: github.repository == 'Fishsb/dsh-plugin-roundtable' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read package version
        id: version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          echo "value=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
            test -f "release-notes/v${PACKAGE_VERSION}.md"
          else
            test "${RELEASE_VERSION}" = "${PACKAGE_VERSION}"
          fi

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build and pack
        run: |
          npm run typecheck
          npm run build
          npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        run: npm publish --ignore-scripts --access public

  release:
    # 不依赖 publish：npm 发布被跳过时 Release 仍应产出（needs 指向被跳过 job 会连带跳过）
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read package version
        id: version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          echo "value=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: RoundTable v${{ steps.version.outputs.value }}
          body_path: release-notes/v${{ steps.version.outputs.value }}.md
          draft: false
          prerelease: false
